# GitHub Actions workflow for the Structured Data Extractor.
#
# What this does: every time you push code or open a pull request, GitHub spins up
# a fresh Linux machine, installs Python and your dependencies, and runs your tests.
# Pass -> green checkmark on the commit. Fail -> red X and a log to read. Free on
# public repos.
#
# It's KEYLESS on purpose. The whole test suite runs the OFFLINE extractor, so no
# GEMINI_API_KEY and no network call is needed. CI never spends money and never
# depends on a third-party API being up.
#
# WHERE THIS FILE GOES: copy it to ".github/workflows/ci.yml" at the ROOT of your
# repo. This project publishes the WHOLE project folder (with build_from_scratch/
# as a subfolder), so the tests live in build_from_scratch/tests -- that's why the
# steps below run inside build_from_scratch via "working-directory".

# The name shown in the repo's "Actions" tab.
name: CI

# "on" decides WHEN this runs. Here: on every push, and on every pull request.
on:
  push:
  pull_request:

# A workflow is made of one or more "jobs". We have one job, called "test".
jobs:
  test:
    # The kind of machine to run on. ubuntu-latest is a standard, free Linux box.
    # Your tests are pure Python, so they pass on Linux even though you develop on Windows.
    runs-on: ubuntu-latest

    # Run every "run:" step from inside build_from_scratch/, where requirements-dev.txt
    # and the tests live. (This does not affect the "uses:" steps below.)
    defaults:
      run:
        working-directory: build_from_scratch

    # "steps" run top to bottom on that machine.
    steps:
      # Step 1: download your repo's code onto the runner. Without this, the machine
      # is empty and has nothing to test. "uses" pulls in a prebuilt, official action.
      - name: Check out the code
        uses: actions/checkout@v4

      # Step 2: install Python. Pin a version so CI matches what you develop against.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Cache pip downloads between runs so installs are faster.
          cache: pip
          cache-dependency-path: build_from_scratch/requirements-dev.txt

      # Step 3: install dev dependencies (the app plus pytest/httpx/ruff).
      # requirements-dev.txt starts with "-r requirements.txt", so this single install
      # pulls in everything. Runs inside build_from_scratch (see working-directory).
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Step 4: run the tests. pyproject.toml already tells pytest where the tests
      # are (testpaths = ["tests"]), so a bare "pytest" from build_from_scratch finds
      # and runs the whole suite. The job passes only if every test passes.
      - name: Run tests (offline, no API key)
        run: pytest
